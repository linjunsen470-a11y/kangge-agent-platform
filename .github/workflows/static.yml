name: Static checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/static-check"
          "$RUNNER_TEMP/static-check/bin/python" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: PyYAML==6.0.3
      - name: Check all Git objects and validate sources
        run: |
          "$RUNNER_TEMP/static-check/bin/python" -I tools/check_repository.py
